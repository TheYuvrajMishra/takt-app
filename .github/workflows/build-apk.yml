# Takt — build a signed (or unsigned, if no keystore secrets exist) arm64-v8a
# release APK and publish it on the rolling GitHub Release tagged `latest`.
#
# Runner note: do NOT use ubuntu-24.04-arm here. The ARM runner cannot run
# the x86_64 CMake 3.22.1 binary the Android SDK ships (Skia / Reanimated /
# Worklets C++ configure fails with `Syntax error: ")" unexpected`), so use
# the x86_64 runner. The Gradle invocation below already pins
# `-PreactNativeArchitectures=arm64-v8a`, so an x86_64 runner still produces
# the same arm64-v8a APK, just cross-compiled.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0 platforms;android-35

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Set versionCode from run number
        run: |
          python3 - <<'EOF'
          import os, re
          path = "android/app/build.gradle"
          src = open(path).read()
          new, n = re.subn(r"versionCode \d+", f"versionCode {os.environ['VERSION_CODE']}", src, count=1)
          assert n == 1, "versionCode line not found in android/app/build.gradle"
          open(path, "w").write(new)
          print(f"versionCode set to {os.environ['VERSION_CODE']}")
          EOF

      - name: Detect signing secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — building UNSIGNED release APK."
          fi

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "Keystore restored; signing config written to android/gradle.properties."

      - name: Build release APK (arm64-v8a)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ./app-release.apk

      - name: Write version.json
        run: |
          python3 - <<'EOF'
          import hashlib, json, os
          from datetime import datetime, timezone
          app = json.load(open('app.json'))['expo']
          apk = 'app-release.apk'
          info = {
            'versionCode': int(os.environ['VERSION_CODE']),
            'versionName': app.get('version', '1.0.0'),
            'apkUrl': 'https://github.com/TheYuvrajMishra/takt-app/releases/latest/download/app-release.apk',
            'sha256': hashlib.sha256(open(apk, 'rb').read()).hexdigest(),
            'sizeBytes': os.path.getsize(apk),
            'notes': os.popen("git log -1 --format=%s").read().strip(),
            'publishedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          open('version.json', 'w').write(json.dumps(info, indent=2))
          print(json.dumps(info))
          EOF

      - name: Replace rolling `latest` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          SIGNED="unsigned"
          if [ "$HAS_KEYSTORE" = "true" ]; then SIGNED="signed"; fi
          gh release create latest \
            --title "Latest build (run #${{ github.run_number }})" \
            --notes "Takt ${SIGNED} release APK, versionCode ${{ github.run_number }} (commit ${{ github.sha }})" \
            ./app-release.apk \
            ./version.json
